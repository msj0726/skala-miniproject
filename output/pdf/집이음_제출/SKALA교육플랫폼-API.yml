openapi: 3.0.3
info:
  title: SKALA 스마트 교육플랫폼 API
  description: |
    과제 및 피드백 통합 관리 시스템 (SKALA) 서비스 제공을 위한 RESTful API 명세서입니다.

    ## 인증 방식
    - 로그인 성공 시 JWT Access Token을 발급하며, 이후 모든 요청의 Authorization 헤더에 Bearer Token을 포함합니다.
    - 사용자 ID 접두사로 역할을 판별합니다: A(관리자), M(교수자), S(교육생)

    ## 공통 규칙
    - 날짜/시간 형식: ISO 8601 (예: 2026-01-09T23:59:00)
    - 페이지네이션: 목록 API에 page, size 쿼리 파라미터 지원 (선택). 목록 응답은 PagedResponse 래퍼 구조로 반환됩니다.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: 로컬 개발 서버

tags:
  - name: Auth
    description: 인증 및 회원가입
  - name: Admin
    description: 시스템 관리자 전용 (사용자/강좌 관리)
  - name: Course
    description: 강좌 및 학습 활동(과제/퀴즈) 조회
  - name: Professor
    description: 교수자 전용 (출제 및 채점)
  - name: Student
    description: 교육생 전용 (제출 및 피드백 확인)

paths:
  # ==========================================
  # [Auth] 로그인 및 회원가입
  # ==========================================
  /auth/signup:
    post:
      tags: [Auth]
      summary: 신규 회원가입 신청
      description: |
        사번(M) 또는 학번(S)으로 회원가입을 신청합니다.
        ID 접두사에 따라 역할이 자동 배정되며, 가입 후 상태는 PENDING으로 설정됩니다.
        관리자의 승인(APPROVED) 후 로그인이 가능합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, password]
              properties:
                id:
                  type: string
                  description: 사번(M으로 시작) 또는 학번(S로 시작)
                  example: S2026001
                name:
                  type: string
                  description: 사용자 실명
                  example: 홍길동
                password:
                  type: string
                  description: 비밀번호
                  format: password
      responses:
        '201':
          description: 가입 신청 완료 (상태 PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 이미 존재하는 ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: 시스템 로그인
      description: |
        ID와 비밀번호로 로그인합니다.
        승인 완료(APPROVED) 상태의 사용자만 로그인 가능합니다.
        성공 시 JWT Access Token과 사용자 정보를 반환합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, password]
              properties:
                id:
                  type: string
                  example: S2026001
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT Access Token
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # [Admin] 시스템 관리자 - 사용자 관리
  # ==========================================
  /admin/users:
    get:
      tags: [Admin]
      summary: 전체 사용자 목록 조회
      description: 시스템에 등록된 모든 사용자(승인/대기/반려)를 조회합니다.
      parameters:
        - name: status
          in: query
          required: false
          description: 상태 필터 (미입력 시 전체 조회)
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{userId}/status:
    put:
      tags: [Admin]
      summary: 사용자 가입 승인/반려 처리
      description: |
        대기 중인 사용자의 가입을 승인(APPROVED)하거나 반려(REJECTED)합니다.
        승인 시 class_name(소속 반)을 함께 배정할 수 있습니다.
      parameters:
        - name: userId
          in: path
          required: true
          description: 대상 사용자 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                  description: 변경할 상태
                class_name:
                  type: string
                  description: 소속 반 배정 (승인 시, 학생만 해당)
                  example: AI 3기 - 1반
      responses:
        '200':
          description: 상태 변경 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{userId}:
    delete:
      tags: [Admin]
      summary: 사용자 계정 삭제
      description: 특정 사용자의 계정을 영구 삭제합니다. 관련된 제출물 및 응시 기록도 함께 삭제됩니다.
      parameters:
        - name: userId
          in: path
          required: true
          description: 삭제할 사용자 ID
          schema:
            type: string
      responses:
        '204':
          description: 계정 삭제 완료 (No Content)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # [Admin] 시스템 관리자 - 강좌 관리
  # ==========================================
  /admin/courses:
    get:
      tags: [Admin]
      summary: 전체 강좌 목록 조회
      description: 시스템에 개설된 모든 강좌를 조회합니다.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/CourseWithInstructor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Admin]
      summary: 신규 강좌 개설
      description: |
        새로운 강좌를 개설하고 담당 교수를 배정합니다.
        대상 반(target_class)에 속한 학생들은 자동으로 수강 등록됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, target_class, instructor_id, start_date, end_date]
              properties:
                title:
                  type: string
                  description: 강좌명
                  example: 데이터 분석 개요 및 기초통계
                target_class:
                  type: string
                  description: 대상 반
                  example: AI 3기 - 1반
                instructor_id:
                  type: string
                  description: 담당 교수 사번 (M으로 시작)
                  example: M1004
                start_date:
                  type: string
                  format: date
                  example: '2026-01-06'
                end_date:
                  type: string
                  format: date
                  example: '2026-01-09'
      responses:
        '201':
          description: 강좌 개설 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/courses/{id}:
    delete:
      tags: [Admin]
      summary: 강좌 삭제 (폐강)
      description: 강좌를 삭제합니다. 관련된 학습 활동, 제출물, 수강 등록 데이터도 함께 삭제됩니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 삭제할 강좌 ID
          schema:
            type: string
      responses:
        '204':
          description: 삭제 성공 (No Content)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # [Course] 공통 강좌 및 활동 조회
  # ==========================================
  /courses/my:
    get:
      tags: [Course]
      summary: 내 수강/운영 교과과정 목록 조회
      description: |
        현재 로그인한 사용자의 역할에 따라 강좌 목록을 반환합니다.
        - 교육생: 본인이 수강 등록된 강좌 목록
        - 교수자: 본인이 담당하는 강좌 목록
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseWithInstructor'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /courses/{id}:
    get:
      tags: [Course]
      summary: 특정 강좌의 상세 정보 조회
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseWithInstructor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses/{id}/activities:
    get:
      tags: [Course]
      summary: 특정 강좌의 학습 활동(과제/퀴즈) 목록 조회
      description: 해당 강좌에 등록된 모든 과제와 퀴즈를 조회합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 강좌 ID
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: 활동 유형 필터
          schema:
            type: string
            enum: [ASSIGNMENT, QUIZ]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/ActivitySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # [Professor] 과제/퀴즈 출제 및 채점
  # ==========================================
  /courses/{id}/assignments:
    post:
      tags: [Professor]
      summary: 신규 과제 등록
      description: 해당 강좌에 새로운 과제를 등록합니다. 파일 첨부가 필요한 경우 multipart/form-data를 사용합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 강좌 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, deadline, max_score]
              properties:
                title:
                  type: string
                  description: 과제 제목
                content:
                  type: string
                  description: 가이드라인 및 상세 내용
                deadline:
                  type: string
                  format: date-time
                  description: 제출 마감 일시
                max_score:
                  type: integer
                  description: 총 배점
                attachFile:
                  type: string
                  format: binary
                  description: 첨부 파일 (선택)
      responses:
        '201':
          description: 과제 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses/{id}/quizzes:
    post:
      tags: [Professor]
      summary: 신규 퀴즈 등록
      description: 해당 강좌에 새로운 퀴즈를 문항과 함께 등록합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 강좌 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizCreateRequest'
      responses:
        '201':
          description: 퀴즈 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # NOTE: /activities/pending-grades 와 /activities/pending 은
  # /activities/{id} 보다 반드시 먼저 선언해야 합니다.
  # 그렇지 않으면 일부 OpenAPI 파서/프레임워크가 'pending-grades', 'pending'을
  # {id} 경로 파라미터로 잘못 해석할 수 있습니다.

  /activities/pending-grades:
    get:
      tags: [Professor]
      summary: 채점 대기 중인 과제 목록 조회 (대시보드용)
      description: 현재 로그인한 교수자의 강좌 중, 채점이 완료되지 않은 제출물이 있는 과제 목록을 반환합니다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingGradeItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /activities/{id}/submissions:
    get:
      tags: [Professor]
      summary: 특정 활동의 전체 학생 제출물 조회 (채점 화면)
      description: 해당 과제/퀴즈에 대한 모든 학생의 제출물 목록을 조회합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 학습 활동 ID
          schema:
            type: integer
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubmissionWithStudent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /submissions/{submissionId}/grade:
    put:
      tags: [Professor]
      summary: 개별 학생 제출물 채점 및 피드백 저장
      description: 학생의 제출물에 점수와 피드백을 작성합니다. 채점 상태가 DONE으로 변경됩니다.
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: number
                  format: float
                  description: 부여 점수
                  example: 85.0
                feedback:
                  type: string
                  description: 피드백 내용
                  example: 결측치 처리 로직이 훌륭합니다.
      responses:
        '200':
          description: 평가 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # [Student] 과제/퀴즈 제출 및 확인
  # ==========================================
  /activities/pending:
    get:
      tags: [Student]
      summary: 미제출/대기 중인 학습 활동 조회 (대시보드용)
      description: 현재 로그인한 학생이 아직 제출하지 않았거나 마감이 임박한 과제/퀴즈 목록을 반환합니다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingActivityItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /submissions/recent:
    get:
      tags: [Student]
      summary: 최근 도착한 피드백(채점 결과) 목록 조회
      description: 현재 로그인한 학생의 최근 채점 완료된 제출물 목록을 반환합니다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentFeedbackItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # [Course / Professor] 학습 활동 상세 / 수정 / 삭제
  # NOTE: 리터럴 경로(/pending-grades, /pending)가 먼저 선언된 이후에 위치해야 합니다.
  # ==========================================
  /activities/{id}:
    get:
      tags: [Course]
      summary: 특정 학습 활동 상세 조회
      description: 과제 또는 퀴즈의 상세 정보를 조회합니다. 퀴즈인 경우 문항 정보도 포함됩니다.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Professor]
      summary: 학습 활동(과제/퀴즈) 정보 수정
      description: |
        기존 등록된 과제 또는 퀴즈의 정보를 수정합니다.
        과제(ASSIGNMENT)의 첨부파일을 교체하려면 multipart/form-data를 사용하세요.
        파일 교체가 불필요한 경우 application/json을 사용할 수 있습니다.
        새 파일을 업로드하면 기존 파일이 교체됩니다.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActivityUpdateRequest'
                - type: object
                  properties:
                    attachFile:
                      type: string
                      format: binary
                      description: 새 첨부 파일 (선택, 업로드 시 기존 파일 교체 - ASSIGNMENT 전용)
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Professor]
      summary: 학습 활동 삭제
      description: 과제 또는 퀴즈를 삭제합니다. 관련된 제출물과 답안도 함께 삭제됩니다.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 삭제 성공 (No Content)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /activities/{id}/attempts:
    post:
      tags: [Student]
      summary: 퀴즈 최종 답안 제출 및 응시 완료
      description: |
        퀴즈의 답안을 제출합니다.
        객관식과 단답형 문항은 자동 채점되며, 채점 결과가 즉시 반환됩니다.
        최대 응시 횟수(max_attempts)를 초과하면 400 에러가 반환됩니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 퀴즈 활동 ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [time_taken, answers]
              properties:
                time_taken:
                  type: integer
                  description: 소요 시간(초)
                  example: 495
                answers:
                  type: array
                  description: 문항별 답안 목록
                  items:
                    type: object
                    required: [question_id, student_answer]
                    properties:
                      question_id:
                        type: integer
                        description: 문항 ID
                      student_answer:
                        type: string
                        description: 학생 답안 (객관식 보기번호 또는 단답형 텍스트)
      responses:
        '201':
          description: 퀴즈 제출 및 자동 채점 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /activities/{id}/submissions/my:
    get:
      tags: [Student]
      summary: 특정 활동에 대한 나의 제출 상태 및 성적 조회
      description: |
        해당 과제/활동에 대한 현재 로그인한 학생의 제출 정보를 반환합니다.
        아직 제출하지 않은 경우에도 200을 반환하되, 응답 본문은 null입니다.
        UI에서는 null 여부로 미제출/제출 완료 상태를 구분하여 렌더링합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 학습 활동 ID
          schema:
            type: integer
      responses:
        '200':
          description: 성공 (미제출 시 null 반환)
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Student]
      summary: 과제 제출 (파일 첨부)
      description: |
        해당 과제에 파일을 첨부하여 제출합니다. 마감 이후에는 제출이 불가합니다.
        허용 파일 형식: PDF, ZIP, IPYNB 등 (백엔드에서 확장자 검증 수행)
        최대 파일 크기: 50MB (백엔드에서 용량 검증 수행, 초과 시 400 반환)

        **최초 제출 vs 재제출 처리 방식:**
        - 최초 제출: submissions 테이블에 신규 레코드 INSERT
        - 재제출(수정): 기존 레코드의 파일 정보(file_name, file_url)와 updated_at을 UPDATE
        마감 이전이라면 재제출이 가능하며, 동일 endpoint를 재호출하면 됩니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 과제 활동 ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [uploadFile]
              properties:
                uploadFile:
                  type: string
                  format: binary
                  description: 제출할 과제 파일 (PDF, ZIP, IPYNB 등, 최대 50MB)
      responses:
        '201':
          description: 제출 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /activities/{id}/attempts/my:
    get:
      tags: [Student]
      summary: 특정 퀴즈에 대한 나의 응시 정보 조회
      description: 해당 퀴즈의 응시 여부, 소요 시간, 성적 등을 조회합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 퀴즈 활동 ID
          schema:
            type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /attempts/{attemptId}/review:
    get:
      tags: [Student]
      summary: 퀴즈 문항별 나의 답안 및 채점 피드백 리뷰
      description: 퀴즈 응시 후 문항별로 나의 답안, 정답, 획득 점수를 확인합니다.
      parameters:
        - name: attemptId
          in: path
          required: true
          description: 제출(submission) ID
          schema:
            type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    # -------------------------------------------------------
    # 페이지네이션 공통 응답 래퍼
    # -------------------------------------------------------
    PagedResponse:
      type: object
      description: 페이지네이션이 적용된 목록 응답 공통 구조. content 필드에 실제 데이터 배열이 담깁니다.
      properties:
        content:
          type: array
          description: 실제 데이터 목록
          items: {}
        totalElements:
          type: integer
          description: 전체 항목 수
          example: 42
        totalPages:
          type: integer
          description: 전체 페이지 수
          example: 5
        page:
          type: integer
          description: 현재 페이지 번호 (1부터 시작)
          example: 1
        size:
          type: integer
          description: 페이지당 항목 수
          example: 10

    # -------------------------------------------------------
    # 사용자
    # -------------------------------------------------------
    User:
      type: object
      properties:
        id:
          type: string
          description: 사번 또는 학번
          example: S2026001
        name:
          type: string
          example: 홍길동
        role:
          type: string
          enum: [ADMIN, PROFESSOR, STUDENT]
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        class_name:
          type: string
          description: 소속 반 (학생만 해당)
          example: AI 3기 - 1반
        created_at:
          type: string
          format: date-time

    # -------------------------------------------------------
    # 강좌
    # -------------------------------------------------------
    Course:
      type: object
      properties:
        id:
          type: string
          example: C-2026-01
        title:
          type: string
          example: 데이터 분석 개요 및 기초통계
        target_class:
          type: string
          example: AI 3기 - 1반
        instructor_id:
          type: string
          example: M1004
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    CourseWithInstructor:
      description: 강좌 정보 + 담당 교수 이름 포함 (UI 표시용)
      allOf:
        - $ref: '#/components/schemas/Course'
        - type: object
          properties:
            instructor_name:
              type: string
              description: 담당 교수 이름
              example: 박병선
            enrollment_status:
              type: string
              enum: [SCHEDULED, IN_PROGRESS, COMPLETED]
              description: |
                교육생 전용 수강 상태. courses.start_date / end_date와 현재 시각을 서버에서 비교하여 동적으로 계산합니다.
                - SCHEDULED: 수강 예정 (현재 시각 < start_date) → 강좌 홈 이동 불가
                - IN_PROGRESS: 수강 중 (start_date <= 현재 시각 <= end_date) → 강좌 홈 이동 가능
                - COMPLETED: 수강 완료 (현재 시각 > end_date) → 읽기 전용으로 강좌 홈 이동
                교수자에게는 null로 반환됩니다.
              example: IN_PROGRESS

    # -------------------------------------------------------
    # 학습 활동 (과제/퀴즈 통합)
    # -------------------------------------------------------
    Activity:
      type: object
      description: 학습 활동 상세 정보 (퀴즈인 경우 questions 포함)
      properties:
        id:
          type: integer
        course_id:
          type: string
        type:
          type: string
          enum: [ASSIGNMENT, QUIZ]
        title:
          type: string
        content:
          type: string
        deadline:
          type: string
          format: date-time
        max_score:
          type: integer
        file_name:
          type: string
          description: 교수자 첨부파일명 (ASSIGNMENT 전용)
        file_url:
          type: string
          description: 첨부파일 URL (ASSIGNMENT 전용)
        time_limit:
          type: integer
          description: 제한 시간(분) (QUIZ 전용)
        max_attempts:
          type: integer
          description: 최대 응시 횟수 (QUIZ 전용)
        questions:
          type: array
          description: 퀴즈 문항 목록 (QUIZ 전용)
          items:
            $ref: '#/components/schemas/Question'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ActivitySummary:
      type: object
      description: 학습 활동 목록 조회용 요약 (문항 미포함)
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [ASSIGNMENT, QUIZ]
        title:
          type: string
        deadline:
          type: string
          format: date-time
        max_score:
          type: integer
        submission_status:
          type: string
          enum: [NOT_SUBMITTED, SUBMITTED]
          description: |
            현재 사용자의 제출 상태 (학생 전용)
            - NOT_SUBMITTED: 미제출
            - SUBMITTED: 제출 완료
          example: SUBMITTED
        score:
          type: number
          description: 현재 사용자의 획득 점수 (학생 전용)
          format: float
        submission_count:
          type: integer
          description: 제출한 학생 수 (교수자 전용) - enrollments 테이블 기준 수강 등록 학생 중 제출한 인원
        total_students:
          type: integer
          description: 전체 수강 학생 수 (교수자 전용) - enrollments 테이블 기준, 해당 강좌에 등록된 총 학생 수

    ActivityUpdateRequest:
      type: object
      description: 학습 활동 수정 요청 (변경할 필드만 포함)
      properties:
        title:
          type: string
        content:
          type: string
        deadline:
          type: string
          format: date-time
        max_score:
          type: integer
        time_limit:
          type: integer
        max_attempts:
          type: integer
        questions:
          type: array
          description: |
            퀴즈 문항 수정 (QUIZ 전용, 선택). 이 필드가 포함된 경우 기존 문항 전체를 교체합니다.
          items:
            type: object
            required: [question_order, type, score, content]
            properties:
              question_order:
                type: integer
              type:
                type: string
                enum: [MULTIPLE_CHOICE, SHORT_ANSWER]
              score:
                type: integer
              content:
                type: string
              correct_answer:
                type: string
                description: 단답형 정답
              options:
                type: array
                description: 객관식 보기 목록 (MULTIPLE_CHOICE 전용)
                items:
                  $ref: '#/components/schemas/QuestionOption'

    # -------------------------------------------------------
    # 퀴즈 출제 요청
    # -------------------------------------------------------
    QuizCreateRequest:
      type: object
      required: [title, deadline, time_limit, max_attempts, questions]
      properties:
        title:
          type: string
        content:
          type: string
        deadline:
          type: string
          format: date-time
        time_limit:
          type: integer
          description: 제한 시간(분)
        max_attempts:
          type: integer
          description: 최대 응시 횟수
        questions:
          type: array
          items:
            type: object
            required: [question_order, type, score, content]
            properties:
              question_order:
                type: integer
              type:
                type: string
                enum: [MULTIPLE_CHOICE, SHORT_ANSWER]
              score:
                type: integer
              content:
                type: string
              correct_answer:
                type: string
                description: 단답형 정답
              options:
                type: array
                description: 객관식 보기 목록 (MULTIPLE_CHOICE 전용)
                items:
                  $ref: '#/components/schemas/QuestionOption'

    # -------------------------------------------------------
    # 문항 및 보기
    # -------------------------------------------------------
    Question:
      type: object
      properties:
        id:
          type: integer
        question_order:
          type: integer
        type:
          type: string
          enum: [MULTIPLE_CHOICE, SHORT_ANSWER]
        score:
          type: integer
        content:
          type: string
        correct_answer:
          type: string
          description: 단답형 정답 (교수자에게만 노출)
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuestionOption'

    QuestionOption:
      type: object
      properties:
        id:
          type: integer
        option_order:
          type: integer
        content:
          type: string
        is_correct:
          type: boolean
          description: 정답 여부 (교수자에게만 노출)

    # -------------------------------------------------------
    # 제출 및 채점
    # -------------------------------------------------------
    Submission:
      type: object
      properties:
        id:
          type: integer
        activity_id:
          type: integer
        student_id:
          type: string
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        time_taken:
          type: integer
          description: 퀴즈 소요 시간(초)
        file_name:
          type: string
        file_url:
          type: string
        score:
          type: number
          format: float
        feedback:
          type: string
        grading_status:
          type: string
          enum: [PENDING, DONE]
        graded_at:
          type: string
          format: date-time

    SubmissionWithStudent:
      description: 제출물 + 학생 정보 포함 (채점 화면용)
      allOf:
        - $ref: '#/components/schemas/Submission'
        - type: object
          properties:
            student_name:
              type: string
              description: 제출 학생 이름
              example: 홍길동
            is_late:
              type: boolean
              description: 지각 제출 여부 (submitted_at > activities.deadline인 경우 true)
              example: false

    # -------------------------------------------------------
    # 대시보드용 요약 스키마
    # -------------------------------------------------------
    PendingGradeItem:
      type: object
      description: 교수자 대시보드 - 채점 대기 과제 항목
      properties:
        activity_id:
          type: integer
        activity_title:
          type: string
          example: 데이터 전처리 실습 결과물
        course_title:
          type: string
          example: 데이터 분석 개요 및 기초통계
        deadline:
          type: string
          format: date-time
        pending_count:
          type: integer
          description: 채점 대기 건수
          example: 24

    PendingActivityItem:
      type: object
      description: 학생 대시보드 - 미제출 활동 항목
      properties:
        activity_id:
          type: integer
        activity_type:
          type: string
          enum: [ASSIGNMENT, QUIZ]
        activity_title:
          type: string
          example: JAVA 객체지향 프로그래밍 실습
        course_title:
          type: string
          example: JAVA 기초
        deadline:
          type: string
          format: date-time
        days_remaining:
          type: integer
          description: 마감까지 남은 일수
          example: 1

    RecentFeedbackItem:
      type: object
      description: 학생 대시보드 - 최근 피드백 항목
      properties:
        submission_id:
          type: integer
        activity_title:
          type: string
          example: HTML/CSS 로그인 페이지 클론 코딩
        activity_type:
          type: string
          enum: [ASSIGNMENT, QUIZ]
        instructor_name:
          type: string
          example: 이상민
        score:
          type: number
          format: float
          example: 95.0
        max_score:
          type: integer
          example: 100
        feedback:
          type: string
        graded_at:
          type: string
          format: date-time

    # -------------------------------------------------------
    # 퀴즈 응시 및 리뷰
    # -------------------------------------------------------
    QuizAttemptSummary:
      type: object
      description: 퀴즈 응시 요약 정보
      properties:
        submission_id:
          type: integer
        status:
          type: string
          description: 응시 상태
          example: 응시 완료
        submitted_at:
          type: string
          format: date-time
        time_taken:
          type: integer
          description: 소요 시간(초)
        score:
          type: number
          format: float
        max_score:
          type: integer
        grading_status:
          type: string
          enum: [PENDING, DONE]

    QuizReview:
      type: object
      description: 퀴즈 문항별 채점 결과 리뷰
      properties:
        submission_id:
          type: integer
        total_score:
          type: number
          format: float
        max_score:
          type: integer
        answers:
          type: array
          items:
            type: object
            properties:
              question_id:
                type: integer
              question_order:
                type: integer
              question_type:
                type: string
                enum: [MULTIPLE_CHOICE, SHORT_ANSWER]
              question_content:
                type: string
              question_score:
                type: integer
                description: 문항 배점
              student_answer:
                type: string
              correct_answer:
                type: string
              is_correct:
                type: boolean
              earned_score:
                type: integer
              options:
                type: array
                description: 객관식 보기 (해당 시)
                items:
                  $ref: '#/components/schemas/QuestionOption'

    # -------------------------------------------------------
    # 공통 에러
    # -------------------------------------------------------
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: HTTP 상태 코드
          example: 400
        message:
          type: string
          description: 에러 메시지
          example: 필수 파라미터가 누락되었습니다.

  responses:
    BadRequest:
      description: 잘못된 요청 (필수 파라미터 누락, 유효성 검증 실패 등)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 인증 실패 (토큰 없음, 만료, 권한 부족)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 권한 없음 (인증은 됐으나 해당 리소스에 접근할 권한이 없음)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 요청한 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: 페이지 번호 (1부터 시작)
      schema:
        type: integer
        default: 1
        minimum: 1
    SizeParam:
      name: size
      in: query
      required: false
      description: 페이지당 항목 수
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100