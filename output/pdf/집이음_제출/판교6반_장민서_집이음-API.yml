openapi: "3.0.3"
info:
  title: "집이음 API"
  version: "1.0.0"
  description: "판교6반 장민서. 프론트엔드 데모를 서버로 연결하기 위한 목표 명세. 실제 구현 완료 API가 아님. 필수 전문가 3분야, 6단계 19개 업무. 금액은 원(KRW); UI의 만원 입력은 10000배 변환. ISO 8601 UTC 저장·한국시간 표시. 일반/전문가 인증 및 소유권 검사는 필요하지만 과제 범위에 따라 Security Schemes는 정의하지 않음. 데모 컨텍스트 전환/초기화는 운영 API와 분리. 일반 목록은 items,next_cursor 페이지 구조. 산출 진행률은 저장하지 않고 현재 선택된 업무에서 계산."
servers:
  -
    url: "https://api.jibeum.example/v1"
    description: "설계용 예시 주소; 실제 서버 아님"
tags:
  -
    name: "계정"
  -
    name: "전문가"
  -
    name: "구매"
  -
    name: "요청·견적"
  -
    name: "업무"
  -
    name: "문서"
  -
    name: "메시지"
  -
    name: "데모 관리"
paths:
  "/me":
    get:
      operationId: "getMe"
      tags:
        - "계정"
      summary: "현재 사용자 조회"
      description: "현재 사용자 조회"
      responses:
        "200":
          description: "처리 성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "500":
          "$ref": "#/components/responses/InternalError"
    patch:
      operationId: "updateMe"
      tags:
        - "계정"
      summary: "구매자 표시 이름 저장"
      description: "구매자 표시 이름 저장"
      responses:
        "200":
          description: "처리 성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  minLength: 1
                  maxLength: 50
              additionalProperties: false
              required:
                - "name"
  "/experts":
    get:
      operationId: "listExperts"
      tags:
        - "전문가"
      summary: "전문가 검색·분야 필터"
      description: "공개 프로필 조회. case_id가 없으면 비회원 조회 가능. 데모는 분야별 3명, 총 9명. 전문가 총수는 운영 시 제한하지 않는다."
      responses:
        "200":
          description: "처리 성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ExpertPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "500":
          "$ref": "#/components/responses/InternalError"
      parameters:
        -
          name: "expert_type"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
            enum:
              - "BROKER"
              - "LEGAL"
              - "TAX"
        -
          name: "case_id"
          in: "query"
          required: false
          description: "선택 여부 표시에 사용할 내 프로젝트 UUID"
          schema:
            type: "string"
        -
          name: "cursor"
          in: "query"
          required: false
          description: "불투명 커서; 생략 시 첫 페이지"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
          description: "페이지 크기"
  "/experts/{expert_id}":
    get:
      operationId: "getExpert"
      tags:
        - "전문가"
      summary: "전문가 공개 정보"
      description: "전문가 공개 정보"
      responses:
        "200":
          description: "처리 성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ExpertView"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "500":
          "$ref": "#/components/responses/InternalError"
      parameters:
        -
          name: "expert_id"
          in: "path"
          required: true
          description: "expert_id UUID"
          schema:
            type: "string"
            format: "uuid"
  "/cases":
    get:
      operationId: "listCases"
      tags:
        - "구매"
      summary: "내 구매 프로젝트 목록"
      description: "내 구매 프로젝트 목록"
      responses:
        "200":
          description: "처리 성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CasePage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
      parameters:
        -
          name: "cursor"
          in: "query"
          required: false
          description: "불투명 커서; 생략 시 첫 페이지"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
          description: "페이지 크기"
    post:
      operationId: "createCase"
      tags:
        - "구매"
      summary: "구매 프로젝트 생성"
      description: "buyer_id는 인증 계정에서 결정. workflow_version=3. 담당자는 자동 선택하지 않는다. 초기 팀 슬롯 3개는 미선택으로 표시."
      responses:
        "201":
          description: "생성 완료"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PurchaseCase"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CaseInput"
  "/cases/{case_id}":
    get:
      operationId: "getCase"
      tags:
        - "구매"
      summary: "구매 조건 조회"
      description: "구매 조건 조회"
      responses:
        "200":
          description: "처리 성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PurchaseCase"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
      parameters:
        -
          name: "case_id"
          in: "path"
          required: true
          description: "case_id UUID"
          schema:
            type: "string"
            format: "uuid"
    patch:
      operationId: "updateCase"
      tags:
        - "구매"
      summary: "구매 조건 수정"
      description: "소유 구매자만 수정. 최신 조건은 연결된 전문가의 고객 업무 화면에 반영. 변경 활동 기록 생성."
      responses:
        "200":
          description: "처리 성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PurchaseCase"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
      parameters:
        -
          name: "case_id"
          in: "path"
          required: true
          description: "case_id UUID"
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CaseUpdate"
  "/cases/{case_id}/dashboard":
    get:
      operationId: "getCaseDashboard"
      tags:
        - "구매"
      summary: "팀·진행률·단계·활동 요약"
      description: "전체 19개 정의가 분모. 현재 선택된 Task 완료 수만 분자. percent=round(완료수/19*100). 미선택도 분모에 포함. 단계 상태는 서버 계산."
      responses:
        "200":
          description: "처리 성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Dashboard"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
      parameters:
        -
          name: "case_id"
          in: "path"
          required: true
          description: "case_id UUID"
          schema:
            type: "string"
            format: "uuid"
  "/cases/{case_id}/requests":
    get:
      operationId: "listCaseRequests"
      tags:
        - "구매"
      summary: "프로젝트 요청·견적 목록"
      description: "프로젝트 요청·견적 목록"
      responses:
        "200":
          description: "처리 성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RequestPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
      parameters:
        -
          name: "case_id"
          in: "path"
          required: true
          description: "case_id UUID"
          schema:
            type: "string"
            format: "uuid"
        -
          name: "expert_type"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
            enum:
              - "BROKER"
              - "LEGAL"
              - "TAX"
        -
          name: "cursor"
          in: "query"
          required: false
          description: "불투명 커서; 생략 시 첫 페이지"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
          description: "페이지 크기"
    post:
      operationId: "createRequest"
      tags:
        - "구매"
      summary: "후보에게 상담·견적 요청"
      description: "같은 case_id+expert_id 중복은 409 DUPLICATE_REQUEST. 요청과 Conversation을 함께 생성. 여러 후보에게 요청 가능; 담당자 확정 아님."
      responses:
        "201":
          description: "생성 완료"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RequestView"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
      parameters:
        -
          name: "case_id"
          in: "path"
          required: true
          description: "case_id UUID"
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                expert_id:
                  type: "string"
                  format: "uuid"
                note:
                  type: "string"
                  minLength: 1
                  maxLength: 2000
              additionalProperties: false
              required:
                - "expert_id"
                - "note"
  "/requests/{request_id}":
    get:
      operationId: "getRequest"
      tags:
        - "요청·견적"
      summary: "요청·견적 상세 조회"
      description: "요청·견적 상세 조회"
      responses:
        "200":
          description: "처리 성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RequestView"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
      parameters:
        -
          name: "request_id"
          in: "path"
          required: true
          description: "request_id UUID"
          schema:
            type: "string"
            format: "uuid"
  "/requests/{request_id}/quote":
    post:
      operationId: "createQuote"
      tags:
        - "요청·견적"
      summary: "담당 후보가 견적 발송"
      description: "요청받은 전문가만 가능. 1개 요청에 1개 견적. 보수+부가세가 합계; 실제 세금·공과금은 제외. 중복 발송 409 QUOTE_EXISTS."
      responses:
        "201":
          description: "생성 완료"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Quote"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
      parameters:
        -
          name: "request_id"
          in: "path"
          required: true
          description: "request_id UUID"
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/QuoteInput"
  "/quotes/{quote_id}/selection":
    post:
      operationId: "selectQuote"
      tags:
        - "요청·견적"
      summary: "구매자가 최종 담당자 선택"
      description: "소유 구매자만. 분야별 현재 담당자 1명. 팀 선택·업무·업무 체크리스트·요청/견적 상태·활동을 단일 트랜잭션으로 반영. 교체 시 기존 업무는 REPLACED, 기존 견적 OFFERED, 기존 요청 QUOTED, 기존 문서 권한 false. 현재 체크 완료 수가 1 이상이면 담당자 교체 409 WORK_STARTED. 같은 견적 재선택은 기존 결과 반환. 프로젝트 행 잠금으로 동시 선택 직렬화."
      responses:
        "200":
          description: "처리 성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SelectionResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
      parameters:
        -
          name: "quote_id"
          in: "path"
          required: true
          description: "quote_id UUID"
          schema:
            type: "string"
            format: "uuid"
  "/expert/dashboard":
    get:
      operationId: "getExpertDashboard"
      tags:
        - "전문가"
      summary: "현재 전문가 대시보드"
      description: "현재 전문가 대시보드"
      responses:
        "200":
          description: "처리 성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ExpertDashboard"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/expert/requests":
    get:
      operationId: "listExpertRequests"
      tags:
        - "전문가"
      summary: "나에게 온 요청"
      description: "나에게 온 요청"
      responses:
        "200":
          description: "처리 성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RequestPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
      parameters:
        -
          name: "status"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
            enum:
              - "REQUESTED"
              - "QUOTED"
              - "SELECTED"
        -
          name: "cursor"
          in: "query"
          required: false
          description: "불투명 커서; 생략 시 첫 페이지"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
          description: "페이지 크기"
  "/expert/engagements":
    get:
      operationId: "listExpertEngagements"
      tags:
        - "전문가"
      summary: "내가 담당하는 업무"
      description: "내가 담당하는 업무"
      responses:
        "200":
          description: "처리 성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EngagementPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
      parameters:
        -
          name: "cursor"
          in: "query"
          required: false
          description: "불투명 커서; 생략 시 첫 페이지"
          schema:
            type: "string"
        -
          name: "limit"
          in: "query"
          required: false
          schema:
