openapi: 3.0.3
info:
  title: 집이음 - 아파트 구매 통합 지원 API
  version: 1.0.0
  description: 설계 과제용 MVP 명세. 서비스 화면/데이터 모델과 동일 범위. 기본 URL /api/v1. 시간 UTC ISO8601, UI Asia/Seoul. 금액 원 단위 정수. 페이지
    번호 방식 목록, 기본 createdAt DESC,id DESC (메시지 예외). 세션 쿠키 인증을 가정하되 평가 제외 항목인 Security Schemes는 생략한다. 모든 역할·소유권은 서버
    검증. 개인정보 공유는 요청별 동의, 문서는 별도 권한. 금전 결제, 자동 세금 판정, 공공기관 신고·등기 접수는 제공하지 않는다. 종료 프로젝트에서는 신규 요청·예약·문서업로드·메시지·업무수정을
    409 CASE_CLOSED로 거부한다. 목록 정렬은 createdAt,id로 안정 정렬한다.
servers:
- url: https://api.jipieum.example/api/v1
  description: 구현 전 예시 서버; 실제 서비스 주소 아님
paths:
  /auth/register:
    post:
      operationId: register
      summary: 회원가입
      tags:
      - PUBLIC
      description: '허용 액터: PUBLIC. 이메일 중복 409 EMAIL_EXISTS. 사용자 및 서버 세션을 생성하고 HttpOnly Secure SameSite=Lax 쿠키 설정.'
      responses:
        '201':
          description: 성공 (리소스 생성)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
  /auth/login:
    post:
      operationId: login
      summary: 로그인
      tags:
      - PUBLIC
      description: '허용 액터: PUBLIC. 인증 실패 401 INVALID_CREDENTIALS. 정지 계정 403 ACCOUNT_SUSPENDED. 세션 쿠키 설정.'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /auth/logout:
    post:
      operationId: logout
      summary: 로그아웃
      tags:
      - BUYER
      description: '허용 액터: BUYER,EXPERT,ADMIN. 서버 세션 폐기 및 쿠키 삭제. 이미 로그아웃된 요청도 204.'
      responses:
        '204':
          description: 성공
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - BUYER
      - EXPERT
      - ADMIN
  /me:
    get:
      operationId: getMe
      summary: 내 계정
      tags:
      - BUYER
      description: '허용 액터: BUYER,EXPERT,ADMIN. '
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - BUYER
      - EXPERT
      - ADMIN
    patch:
      operationId: updateMe
      summary: 이름 수정
      tags:
      - BUYER
      description: '허용 액터: BUYER,EXPERT,ADMIN. '
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - BUYER
      - EXPERT
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
  /cases:
    get:
      operationId: listCases
      summary: 내 프로젝트
      tags:
      - BUYER
      description: '허용 액터: BUYER. ownerId=현재 사용자만 반환.'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseCasePage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - BUYER
      parameters:
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    post:
      operationId: createCase
      summary: 프로젝트 생성
      tags:
      - BUYER
      description: '허용 액터: BUYER. budgetMin<=budgetMax 검증. CONSULTATION도 동일 프로젝트 생성. riskHints는 법률/세액 판정이 아닌 상담
        권고 규칙.'
      responses:
        '201':
          description: 성공 (리소스 생성)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - BUYER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreate'
  /cases/{caseId}:
    get:
      operationId: getCase
      summary: 프로젝트 상세
      tags:
      - BUYER
      description: '허용 액터: BUYER,EXPERT. 소유자 또는 해당 프로젝트의 OPEN/QUOTED/ACCEPTED 요청 수신 전문가만 조회. 전문가는 본인 engagement만
        응답. 취소 요청만 있고 업무 연결이 없으면 접근 회수.'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - BUYER
      - EXPERT
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: ''
        description: 해당 리소스 식별자
    patch:
      operationId: updateCase
      summary: 프로젝트 수정·종료
      tags:
      - BUYER
      description: '허용 액터: BUYER. 소유자만. version 불일치 409 STALE_VERSION. COMPLETED는 모든 engagement 완료 및 OPEN/QUOTED
        요청 없음. CANCELLED는 업무 연결 전만. 종료 후 변경 금지. 변경 시 활성 담당자 알림. COMPLETED는 최소 1개 완료 업무 필요. CANCELLED 처리 시 모든 남은
        요청 취소 및 OFFERED 견적 거절.'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - BUYER
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: ''
        description: 해당 리소스 식별자
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseUpdate'
  /experts:
    get:
      operationId: listExperts
      summary: 검증 전문가 검색
      tags:
      - PUBLIC
      description: '허용 액터: PUBLIC. VERIFIED만 공개, createdAt DESC,id DESC. 지역/이름/사무소 문자열 검색.'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpertProfilePage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - PUBLIC
      parameters:
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: serviceType
        in: query
        required: false
        description: ''
        schema: &id001
          type: string
          enum:
          - BROKER
          - LEGAL
          - TAX
          description: BROKER=공인중개사, LEGAL=법무사, TAX=세무사
      - name: region
        in: query
        required: false
        description: ''
        schema:
          type: string
          minLength: 1
          maxLength: 100
          description: ''
      - name: q
        in: query
        required: false
        description: ''
        schema:
          type: string
          minLength: 1
          maxLength: 100
          description: ''
  /experts/{expertId}:
    get:
      operationId: getExpert
      summary: 전문가 상세
      tags:
      - PUBLIC
      description: '허용 액터: PUBLIC. VERIFIED만 반환, 그 외 404.'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpertProfile'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - PUBLIC
      parameters:
      - name: expertId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: ''
        description: 해당 리소스 식별자
  /experts/{expertId}/reviews:
    get:
      operationId: listExpertReviews
      summary: 전문가 후기
      tags:
      - PUBLIC
      description: '허용 액터: PUBLIC. VISIBLE만, 저자 ID로 개인 이메일 노출 금지.'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - PUBLIC
      parameters:
      - name: expertId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: ''
        description: 해당 리소스 식별자
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
  /cases/{caseId}/requests:
    post:
      operationId: createRequest
      summary: 상담·견적 요청
      tags:
      - BUYER
      description: '허용 액터: BUYER. 소유자만. 검증 전문가만. 같은 전문가에게 활성 요청 중복 409 DUPLICATE_REQUEST. 동의문 버전 불일치 409 CONSENT_UPDATED.
        전문가에게 알림.'
      responses:
        '201':
          description: 성공 (리소스 생성)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - BUYER
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: ''
        description: 해당 리소스 식별자
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCreate'
    get:
      operationId: listRequests
      summary: 프로젝트 요청 목록
      tags:
      - BUYER
      description: '허용 액터: BUYER. 소유자만.'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - BUYER
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: ''
        description: 해당 리소스 식별자
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
  /requests/{requestId}/cancel:
    post:
      operationId: cancelRequest
      summary: 요청 취소
      tags:
      - BUYER
      description: '허용 액터: BUYER. 소유자만 OPEN/QUOTED -> CANCELLED. 기존 OFFERED 견적은 DECLINED. ACCEPTED는 409. 공유 접근 회수.'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - BUYER
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: ''
        description: 해당 리소스 식별자
  /cases/{caseId}/quotes:
    get:
      operationId: listQuotes
      summary: 견적 비교
      tags:
      - BUYER
      description: '허용 액터: BUYER. 소유자만; 견적별 전문가 표시. 총액=fee+vat+estimatedExpenses. 유효기간 지난 견적 선택 비활성화.'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteItemPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-roles:
      - BUYER
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: ''
        description: 해당 리소스 식별자
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
  /quotes/{quoteId}/accept:
    post:
      operationId: acceptQuote
      summary: 견적 선택·업무 연결
      tags:
      - BUYER
      description: '허용 액터: BUYER. 소유자만. 만료 409 QUOTE_EXPIRED. 같은 case/serviceType ACTIVE 업무 하나만. DB 트랜잭션: 견적 ACCEPTED,
