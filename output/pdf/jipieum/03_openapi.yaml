components:
  schemas:
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: 식별자
        email: &id002
          type: string
          format: email
          maxLength: 254
        name: &id003
          type: string
          minLength: 1
          maxLength: 50
          description: 표시 이름
        role:
          type: string
          enum:
          - BUYER
          - EXPERT
          - ADMIN
          description: ''
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          description: ''
        createdAt:
          type: string
          format: date-time
          description: 생성시각
      required:
      - id
      - email
      - name
      - role
      - status
      - createdAt
    Session:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: 식별자
        userId:
          type: string
          format: uuid
          description: ''
        tokenHash:
          type: string
          minLength: 1
          maxLength: 128
          description: 세션 토큰의 해시
        expiresAt:
          type: string
          format: date-time
          description: ''
        revokedAt:
          type: string
          format: date-time
          description: ''
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: 생성시각
      required:
      - id
      - userId
      - tokenHash
      - expiresAt
      - revokedAt
      - createdAt
    ExpertProfile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: 식별자
        userId:
          type: string
          format: uuid
          description: ''
        serviceType: *id001
        displayName: &id017
          type: string
