if(db.workflowVersion!==WORKFLOW_VERSION){
 db.requests.forEach(r=>{if(['active','completed'].includes(r.status)){r.legacyTasks=r.tasks||[];r.tasks=TASKS[experts.find(e=>e.id===r.expert).role].map(title=>({title,done:false}));r.status='active'}});

let mode=new URLSearchParams(location.search).get('mode')==='expert'?'expert':'buyer';let page=mode==='expert'?'dashboard':'home';let expertId='b1',filter='전체',wizard=1,draft={};

let conversation=params.get('conversation')||'all';if(experts.some(e=>e.id===params.get('expert')))expertId=params.get('expert');

function toast(t){document.querySelector('#toast').className='toast';document.querySelector('#toast').textContent=t;setTimeout(()=>{document.querySelector('#toast').className='';document.querySelector('#toast').textContent=''},2600)}

function button(t,js,cls=''){return `<button type="button" class="btn ${cls}" onclick="${js}">${t}</button>`}function empty(t,p,action=''){return `<div class="empty"><div class="eyebrow">YOUR NEXT STEP</div><h2>${t}</h2><p>${p}</p>${action}</div>`}

function home(){return `<section class="hero"><div><div class="eyebrow">A BETTER WAY TO BUY YOUR HOME</div><h1>처음 만나는 내 집,<br>끝까지 이어지는<br><span class="green">든든한 전문가.</span></h1><p>집을 찾는 순간부터 내 이름으로 등기되는 날까지.<br>공인중개사·세무사·법무사 3명 선택 후<br><b class="green">6단계·19개 업무</b>를 함께 진행하세요.</p><div class="actions">${button(db.project?'내 구매 여정 이어가기 →':'나의 구매 여정 시작하기 →',db.project?"go('project')":"start()",'primary')}${button('전문가 둘러보기',"go('experts')")}</div><div class="subtle">조건 입력은 약 2분 · 세 분야 전문가가 함께하는 구매 서비스</div></div><div class="hero-art" role="img" aria-label="따뜻한 햇살 아래 아파트 일러스트"><div class="orb"></div><div class="building">${'<span></span>'.repeat(15)}</div><div class="building two">${'<span></span>'.repeat(8)}</div><div class="floatcard"><span class="green">✓ 하나의 구매 프로젝트</span><b>중개부터 등기까지, 연결 완료</b><small>흩어진 일정과 문서를 한눈에</small></div></div></section><div class="trust"><div><strong>01 &nbsp; 내가 선택하는 전문가</strong><p>업무 범위와 견적을 확인하고 결정하세요.</p></div><div><strong>02 &nbsp; 함께 보는 구매 일정</strong><p>요청·견적·계약·완료까지 한 흐름으로.</p></div><div><strong>03 &nbsp; 내가 정하는 정보 공유</strong><p>전문가별 문서 접근 권한을 직접 관리하세요.</p></div></div><section class="section"><div class="sectionhead"><div><div class="eyebrow">ONE JOURNEY, THREE EXPERTS</div><h2>각자의 전문성이 만나는 한곳</h2></div></div><div class="cards">${ROLES.map((role,i)=>{const e=experts.find(e=>e.role===role.id);return `<article class="card"><div class="stepno">0${i+1} / ${e.type}</div><h3>${['나에게 맞는 집 찾기','안심하고 내 이름으로','계약 전 세금 살펴보기'][i]}</h3><p>${e.desc}</p><div class="splitline"></div><button class="link" onclick="filter='${e.type}';go('experts')">${e.type} 살펴보기 ↗</button></article>`}).join('')}</div></section>`}
function onboard(){return `<div class="onboarding">${heading('GETTING STARTED','우리의 첫 단계, 구매 조건','어떤 집을 찾고 계신가요? 입력한 내용은 나중에 수정할 수 있어요.')}<div class="steps"><${wizard===1?'b':'span'}>01 구매자·주택 조건</${wizard===1?'b':'span'}><${wizard===2?'b':'span'}>02 자금·일정</${wizard===2?'b':'span'}><${wizard===3?'b':'span'}>03 확인·시작</${wizard===3?'b':'span'}></div><form class="panel" onsubmit="wizardNext(event)">${wizard===1?`<h3>당신의 구매 계획을 알려주세요</h3><div class="formgrid"><label class="field">이름<input name="name" required maxlength="30" value="${esc(draft.name)}" placeholder="예: 김지우"></label><label class="field">프로젝트 이름<input name="title" required maxlength="80" value="${esc(draft.title)}" placeholder="예: 우리 가족 첫 아파트"></label><label class="field">희망 지역<input name="region" required value="${esc(draft.region)}"></label><label class="field">구매 예산 (만원)<input name="budget" type="number" min="1" max="10000000" required value="${draft.budget}"></label><label class="field full">현재 세대 보유 주택<select name="homes">${['0','1','2'].map(v=>`<option value="${v}" ${draft.homes===v?'selected':''}>${v==='0'?'없음':v==='1'?'1채':'2채 이상'}</option>`).join('')}</select></label></div>`:wizard===2?`<h3>계약 전에 함께 확인할 조건</h3><div class="formgrid"><label class="field">자금 구성<select name="funding">${['본인 자금','대출 포함','가족 지원금 포함'].map(v=>`<option ${draft.funding===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">명의 계획<select name="ownership">${['단독명의','공동명의','아직 미정'].map(v=>`<option ${draft.ownership===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field full">희망 잔금일 (선택)<input type="date" name="date" value="${draft.date}"></label></div><div class="privacy">이 서비스는 공인중개사·법무사·세무사 연결을 모두 포함합니다. 세 분야 견적을 각각 선택한 뒤 업무를 시작합니다. 세액 계산이나 감면 판정은 제공하지 않습니다.</div>`:`<h3>${esc(draft.name)} 님의 구매 계획</h3><div class="formgrid"><div>프로젝트<br><b>${esc(draft.title)}</b></div><div>희망 지역<br><b>${esc(draft.region)}</b></div><div>구매 예산<br><b>${Number(draft.budget).toLocaleString()}만원</b> function expertList(){
 const list=experts.filter(e=>filter==='전체'||e.type===filter);

function requestModal(id){if(!db.project){toast('구매 조건을 먼저 등록해주세요');start();return}modal(`<h2>${ex(id).name} ${ex(id).type}에게 요청</h2><p class="muted">구매 조건과 아래 요청 내용이 전문가 화면에 전달됩니다.</p><form onsubmit="sendRequest(event,'${id}')"><label class="field" style="margin:20px 0">상담하고 싶은 내용<textarea required name="note" placeholder="예: 예산에 맞는 아파트 후보를 함께 보고 싶어요."></textarea></label><div class="privacy">공유 정보: 프로젝트 이름, 지역, 예산, 보유 주택 수, 자금·명의 조건, 희망 잔금일. 문서는 별도 동의 후 공유됩니다.</div><div class="actions" style="margin-top:20px"><button class="btn primary">요청 보내기</button>${button('취소','closeModal()')}</div></form>`)}

function requestCard(r,isExpert=false){const e=ex(r.expert);const status={requested:'새 요청',quoted:'견적 도착',active:'진행 중',completed:'업무 완료'};return `<article class="request" data-request-id="${r.id}"><div class="row between"><div class="row"><div class="avatar">${isExpert?esc(db.buyer.name[0]):e.name[0]}</div><div><h3>${isExpert?esc(db.buyer.name)+' 님':e.name+' '+e.type}</h3><small>${isExpert?esc(db.project.title):e.office}</small></div></div><span class="badge ${r.status==='requested'?'gold':''}">${isSelected(r)&&!teamReady()&&r.status!=='completed'?'팀 구성 대기':status[r.status]}</span></div><p>${esc(r.note)}</p>${r.quote?`<div class="quote"><div class="row between"><div><small>제안 견적 · 보수와 부가세 합계</small><br><b class="amount">${won(r.quote.fee+r.quote.vat)}</b></div><span class="badge gray">${r.quote.days}일 예상</span></div><small>보수 ${won(r.quote.fee)} / 부가세 ${won(r.quote.vat)} · 세금·공과금 별도</small><p>${esc(r.quote.scope)}</p>${!isExpert&&r.status==='quoted'?(requestFor(e.role)&&journeyMetrics().done>0?'<small>이미 업무가 시작된 분야입니다.</small>':button(requestFor(e.role)?'이 전문가로 변경하기':'이 전문가 선택하기',`acceptQuote('${r.id}')`,'primary small')):''}</div>`:''}<div class="actions" style="margin-top:15px">${isExpert&&r.status==='requested'?button('견적 작성하기',`quoteModal('${r.id}')`,'primary small'):''}${['active','completed'].includes(r.status)?button(isExpert?'업무 관리하기':'담당 단계 보기',isExpert?"go('workspace')":`workModal('${r.id}')`,'small'):''}</div></article>`}
function projectView(){
 if(!db.project)return empty('세 전문가와 함께 구매를 시작하세요','조건 등록 후 공인중개사·법무사·세무사의 견적을 각각 선택합니다.',button('첫 프로젝트 만들기','start()','primary'));
 const p=db.project,m=journeyMetrics(),next=nextAction();
 return `${heading('MY PURCHASE JOURNEY',esc(p.title),'매물 확인부터 취득세·등기 신청까지, 6단계를 순서대로 진행합니다.',button('조건 수정','editConditions()','small'))}
 <nav class="project-steps" aria-label="프로젝트 단계 바로가기"><button onclick="jumpTo('team-section')"><span>STEP 01</span><b>필수 전문가 선택</b><small>${m.selected}/3명 선택</small></button><button onclick="jumpTo('quotes-section')"><span>STEP 02</span><b>요청과 견적 ↓</b><small>${db.requests.filter(r=>r.quote).length}건 견적 수신</small></button><button onclick="jumpTo('purchase-section')"><span>STEP 03</span><b>단계별 업무 진행</b><small>${m.percent}% 완료</small></button></nav>
 <div class="metrics"><div class="metric"><small>필수 전문가 선택</small><b>${m.selected}<small> / 3명</small></b></div><div class="metric"><small>전체 업무 진행률</small><b data-testid="overall-progress">${m.percent}<small> %</small></b></div><div class="metric"><small>구매 단계 완료</small><b>${activePhaseIndex()}<small> / 6단계</small></b></div></div>
 <div class="layout"><div><div class="banner"><div><span class="eyebrow" style="display:block;margin-bottom:5px">YOUR NEXT STEP</span><strong>${next.title}</strong><small>${next.detail}</small></div>${next.action}</div>
 <div class="sectionhead anchor-section" id="team-section"><h2>나의 필수 전문가 팀</h2><span class="badge">${m.selected===3?'팀 구성 완료':'3개 분야 모두 필수'}</span></div>
 <div class="team-grid">${ROLES.map(e=>teamCard(e)).join('')}</div>
 <p class="subtle">전문가 3명을 모두 선택하면 1단계부터 시작합니다. 현재 단계와 다음 할 일을 함께 확인하세요.</p>
 ${phaseBoard()}<div class="sectionhead section anchor-section" id="quotes-section"><h2>요청과 견적</h2><small>${db.requests.length}건</small></div>
 ${db.requests.length?db.requests.map(r=>requestCard(r)).join(''):empty('함께할 세 전문가를 연결해주세요','각 전문가에게 요청하고 견적을 선택하면 업무가 열립니다.',button('전문가 찾기',"go('experts')",'primary'))}
 <div class="panel"><h3>최근 활동</h3>${db.events.slice(0,5).map(e=>`<div class="check"><span>↗</span><div>${esc(e.text)}<br><small>${e.time}</small></div></div>`).join('')}</div></div>
 <aside class="aside journey-aside">${journeyPanel()}<div class="panel"><div class="tabtitle">MY HOME PLAN</div><h3>나의 구매 조건</h3><div class="splitline"></div><p>희망 지역 <b>${esc(p.region)}</b></p><p>구매 예산 <b>${Number(p.budget).toLocaleString()}만원</b></p><p>자금 구성 <b>${esc(p.funding)}</b></p><p>명의 계획 <b>${esc(p.ownership)}</b></p><p>희망 잔금 <b>${p.date||'미정'}</b></p></div></aside></div>`;
}
function acceptQuote(id){
 const r=db.requests.find(r=>r.id===id);if(!r||r.status!=='quoted')return;
 const role=ex(r.expert).role,previous=requestFor(role);
 if(previous&&journeyMetrics().done>0){toast('업무가 시작되어 담당자를 변경할 수 없습니다.');return}
 if(previous){previous.status='quoted';previous.tasks=[];db.grants[previous.expert]=false;}
 r.status='active';r.tasks=TASKS[role].map(title=>({title,done:false}));
 event(ex(r.expert).name+' '+ex(r.expert).type+'의 견적을 선택했습니다');save();render();
 toast(teamReady()?'세 분야 담당자 선택 완료! 업무를 시작할 수 있습니다.':ex(r.expert).name+' 전문가가 나의 팀에 반영되었습니다.');
}
function expertView(){const e=ex(expertId),rs=db.requests.filter(r=>r.expert===expertId);if(page==='profile')return profileView();if(page==='workspace')return workspace(rs);if(page==='requests')return `${heading('CLIENT REQUESTS','요청과 견적','구매자의 조건을 확인하고 업무 범위와 비용을 제안하세요.')}${rs.length?rs.map(r=>requestCard(r,true)).join(''):empty('아직 도착한 요청이 없습니다','구매자 모드 → 전문가 찾기에서 '+e.name+' 전문가에게 요청을 보내보세요.',button('구매자 모드로 이동',"setMode('buyer')",'primary'))}`;return `${heading('PARTNER WORKSPACE',`${e.name} ${e.type}님, 반갑습니다.`, '고객의 구매 여정에 필요한 전문 업무를 한곳에서 관리하세요.',`<span class="badge">${db.profiles[expertId]?'프로필 설정 완료':'체험 파트너 계정'}</span>`)}<div class="metrics"><div class="metric"><small>확인할 새 요청</small><b>${rs.filter(r=>r.status==='requested').length}<small> 건</small></b></div><div class="metric"><small>진행 중 업무</small><b>${rs.filter(r=>r.status==='active').length}<small> 건</small></b></div><div class="metric"><small>업무 완료</small><b>${rs.filter(r=>r.status==='completed').length}<small> 건</small></b></div></div><div class="layout"><div><div class="sectionhead"><h2>나에게 도착한 구매 요청</h2><button class="link" onclick="go('requests')">전체 보기 →</button></div>${rs.length?rs.map(r=>requestCard(r,true)).join(''):empty('첫 고객의 요청을 기다리고 있어요','상단에서 구매자 모드로 전환해 구매 조건과 상담 요청을 등록해보세요.',button('구매자 모드에서 시작',"setMode('buyer')",'primary'))}</div><aside><div class="panel"><div class="tabtitle">PARTNER PROFILE</div><div class="row"><div class="avatar">${e.name[0]}</div><div><h3>${e.name}</h3><small>${e.type}</small></div></div><div class="splitline"></div><p>${esc(db.profiles[expertId]?.office||e.office)}</p><p class="muted">${esc(db.profiles[expertId]?.bio||e.desc)}</p><div style="margin-top:20px">${button('프로필 설정',"go('profile')",'fullbtn')}</div></div><div class="privacy">오른쪽 상단에서 공인중개사·법무사·세무사 계정을 전환할 수 있습니다. 각 계정에는 본인에게 온 요청만 표시됩니다.</div></aside></div>`}
function quoteModal(id){modal(`<h2>고객에게 견적 제안하기</h2><form onsubmit="sendQuote(event,'${id}')"><div class="formgrid"><label class="field">전문가 보수 (원)<input type="number" min="0" max="100000000" required name="fee" value="300000"></label><label class="field">부가세 (원)<input type="number" min="0" max="10000000" required name="vat" value="30000"></label><label class="field">예상 기간 (일)<input type="number" min="1" max="365" name="days" required value="7"></label><label class="field full">업무 범위·추가 비용 안내<textarea required name="scope" placeholder="포함되는 업무와 별도 비용을 구체적으로 적어주세요."></textarea></label></div><div class="actions"><button class="btn primary">구매자에게 견적 보내기</button>${button('취소','closeModal()')}</div></form>`)}
function sendQuote(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const r=db.requests.find(r=>r.id===id);r.quote={fee:Number(f.fee),vat:Number(f.vat),days:Number(f.days),scope:f.scope};r.status='quoted';event(ex(r.expert).name+' 전문가가 견적을 보냈습니다');save();closeModal();render();toast('구매자 프로젝트에 견적이 도착했습니다')}
function workspace(rs){const active=rs.filter(r=>['active','completed'].includes(r.status));return `${heading('CLIENT WORKSPACE','고객 업무 관리','견적이 선택된 고객의 일정, 업무, 대화를 관리합니다.')}${active.length?active.map(r=>`<div class="layout"><div class="panel"><span class="badge">${r.status==='completed'?'업무 완료':teamReady()?'진행 중':'팀 구성 대기'}</span><h2 style="margin-top:12px">${esc(db.project.title)}</h2><p class="muted">${esc(db.buyer.name)} 님 · ${esc(db.project.region)}</p><div class="banner"><div><strong>공유된 구매 조건</strong><small>예산 ${Number(db.project.budget).toLocaleString()}만원 · ${esc(db.project.funding)} · ${esc(db.project.ownership)}<br>보유 주택 ${db.project.homes==='2'?'2채 이상':db.project.homes+'채'} · 희망 잔금일 ${db.project.date||'미정'}</small></div></div><h3>담당 단계</h3>${taskList(r,true)}<div class="section"><h3>고객 메시지</h3><p class="muted">대화는 통합 메시지 센터에서 이어집니다.</p>${messageLink(r.id,'구매자와 대화하기 ↗')}</div></div><aside class="panel"><h3>공유받은 문서</h3>${db.grants[r.expert]?db.documents.length?db.documents.map(d=>`<div class="check"><span>▤</span><div>${esc(d.name)}<br><small>${d.size} KB · 파일명만 공유되는 데모</small></div></div>`).join(''):'<p class="muted">등록된 문서가 없습니다.</p>':'<div class="privacy">구매자가 문서 공유를 허용하지 않았습니다.</div>'}<div class="privacy">권한은 구매자 모드의 문서함에서 변경할 수 있습니다.</div></aside></div>`).join(''):empty('아직 진행 중인 고객 업무가 없어요','견적을 보낸 뒤 구매자가 선택하면 이곳에서 업무를 진행할 수 있습니다.',button('요청·견적 확인',"go('requests')",'primary'))}`}
function taskList(r,editable){
 const done=r.tasks.filter(t=>t.done).length,total=TASKS[experts.find(e=>e.id===r.expert).role].length,percent=Math.round(done/total*100);
 return `<div class="row between" style="margin-top:15px"><strong>${ex(r.expert).type} 업무 ${percent}%</strong><small>${done} / ${total}개 완료</small></div><div class="progress"><span style="width:${percent}%"></span></div>
 ${!teamReady()?'<div class="privacy">세 전문가의 견적을 모두 선택하면 ①단계부터 시작할 수 있습니다.</div>':''}
 ${PHASES.map((p,phaseIndex)=>{if(p.owner!==ex(r.expert).role)return '';const stats=phaseStats(phaseIndex);return `<section class="expert-phase"><div class="row between"><h3>${phaseIndex+1}. ${p.title}</h3><span class="badge gray">${stats.percent}%</span></div>
 <details><summary>세부 업무 확인</summary>${p.tasks.map(title=>{const i=r.tasks.findIndex(t=>t.title===title);if(i<0)return '';const t=r.tasks[i],block=taskBlockReason(r,i,!t.done);return `<div class="check ${t.done?'complete':''}">${editable?`<input id="task-${r.id}-${i}" aria-label="${esc(t.title)}" type="checkbox" ${t.done?'checked':''} ${block?'disabled':''} onchange="toggleTask('${r.id}',${i},this.checked)"><label for="task-${r.id}-${i}">${t.title}${block?`<small class="task-reason">${block}</small>`:''}</label>`:`<span class="dot">${t.done?'✓':'○'}</span><span style="flex:1">${t.title}</span>`}<span class="badge ${t.done?'':'gray'}">${t.done?'완료':block?'대기':'진행 가능'}</span></div>`}).join('')}</details></section>`}).join('')}`;
}
function toggleTask(id,i,done){const r=db.requests.find(r=>r.id===id);if(!r||!r.tasks[i]||mode!=='expert'||r.expert!==expertId)return;const reason=taskBlockReason(r,i,done);if(reason){toast(reason);return}r.tasks[i].done=done;r.status=r.tasks.every(t=>t.done)?'completed':'active';event(ex(r.expert).name+': '+r.tasks[i].title+' '+(done?'완료':'예정으로 변경'));save();render();toast('6단계 진행률과 구매자 화면에 반영되었습니다')}
function chat(r){return `<div class="chat" id="chat-history">${db.messages.filter(m=>m.request===r.id).map(m=>messageBubble(m)).join('')||'<div class="empty-chat"><h3>첫 메시지를 남겨보세요</h3><p>이 대화는 구매자와 담당 전문가만 볼 수 있습니다.</p></div>'}</div><form class="row composer" onsubmit="sendMessage(event,'${r.id}')"><input name="text" required maxlength="1000" aria-label="메시지" placeholder="메시지를 입력하세요" autocomplete="off"><button class="btn primary">전송</button></form>`}
function sendMessage(e,id){e.preventDefault();const r=visibleRequests().find(r=>r.id===id);const text=String(new FormData(e.target).get('text')||'').trim();if(!r||!text)return;db.messages.push({id:uid(),request:id,role:mode,text,time:now()});save();render();document.querySelector('#chat-history')?.scrollTo(0,999999);document.querySelector('.composer input')?.focus()}
function workModal(id){const r=db.requests.find(r=>r.id===id);modal(`<span class="badge">${ex(r.expert).type}</span><h2 style="margin:10px 0">${ex(r.expert).name} 전문가의 업무</h2>${taskList(r,false)}${r.legacyTasks?.length?`<details class="privacy"><summary>절차 변경 전 체크 기록 보기</summary><p>아래 기록은 참고용으로 보관되며 현재 진행률에는 포함되지 않습니다.</p>${r.legacyTasks.map(t=>`<div>${t.done?'✓':'○'} ${esc(t.title)}</div>`).join('')}</details>`:''}<div class="actions" style="margin-top:20px">${messageLink(id,'통합 메시지 센터에서 대화 ↗')}${button('닫기','closeModal()')}</div>`)}
function documentsView(){if(!db.project)return empty('프로젝트를 먼저 만들어주세요','구매 과정의 서류와 전문가별 공유 권한을 관리할 수 있습니다.',button('구매 시작하기','start()','primary'));return `${heading('DOCUMENT VAULT','나의 문서함','필요한 전문가에게만 문서 정보를 공유하세요.')}<div class="layout"><section class="panel"><div class="row between"><h3>구매 관련 문서</h3><label class="btn primary small" for="file">문서 추가 ＋</label><input id="file" type="file" hidden onchange="addDocument(this)"></div><div style="margin:20px 0">${db.documents.length?db.documents.map(d=>`<div class="check"><span>▤</span><div style="flex:1"><b>${esc(d.name)}</b><br><small>${d.size} KB · ${d.time}</small></div><button class="link" onclick="removeDocument('${d.id}')">삭제</button></div>`).join(''):'<p class="muted">매매계약서, 상담자료 등의 파일을 선택해보세요.</p>'}</div><div class="privacy">체험에서는 파일명과 크기만 저장합니다. 파일 내용은 업로드되거나 보관되지 않습니다.</div></section><aside class="panel"><h3>문서 공유 권한</h3><p class="muted">현재 문서 목록 전체에 적용됩니다.</p>${experts.map(e=>`<label class="check"><input type="checkbox" ${db.grants[e.id]?'checked':''} onchange="db.grants['${e.id}']=this.checked;save();toast('공유 권한이 변경되었습니다')"><span>${e.name} ${e.type}</span></label>`).join('')}</aside></div>`}
function addDocument(input){const f=input.files[0];if(!f)return;db.documents.push({id:uid(),name:f.name,size:Math.ceil(f.size/1024),time:now()});event('문서 정보를 등록했습니다');save();render();toast('문서 목록에 추가되었습니다')}
function removeDocument(id){db.documents=db.documents.filter(d=>d.id!==id);save();render()}
function profileView(){const e=ex(expertId),p=db.profiles[expertId]||{office:e.office,bio:e.desc};return `<div class="onboarding">${heading('PARTNER PROFILE','구매자에게 보여줄 나의 소개','프로필을 저장하면 구매자 전문가 목록에도 바로 반영됩니다.')}<form class="panel" onsubmit="saveProfile(event)"><div class="row"><div class="avatar">${e.name[0]}</div><div><h3>${e.name} ${e.type}</h3><small>가상 계정 · 자격 검증 연동 전</small></div></div><div class="formgrid"><label class="field full">사무소명<input required maxlength="80" name="office" value="${esc(p.office)}"></label><label class="field full">소개글<textarea name="bio" required maxlength="400">${esc(p.bio)}</textarea></label></div><button class="btn primary">프로필 저장하기</button></form></div>`}
function saveProfile(e){e.preventDefault();db.profiles[expertId]=Object.fromEntries(new FormData(e.target));save();render();toast('구매자 화면의 전문가 소개도 변경되었습니다')}
function editConditions(){const p=db.project;modal(`<h2>구매 조건 수정</h2><form onsubmit="saveConditions(event)"><div class="formgrid"><label class="field">프로젝트 이름<input required name="title" value="${esc(p.title)}"></label><label class="field">지역<input required name="region" value="${esc(p.region)}"></label><label class="field">예산 (만원)<input required type="number" min="1" max="10000000" name="budget" value="${p.budget}"></label><label class="field">희망 잔금일<input type="date" name="date" value="${p.date}"></label><label class="field">보유 주택<select name="homes">${['0','1','2'].map(v=>`<option value="${v}" ${p.homes===v?'selected':''}>${v==='2'?'2채 이상':v+'채'}</option>`).join('')}</select></label><label class="field">자금 구성<select name="funding">${['본인 자금','대출 포함','가족 지원금 포함'].map(v=>`<option ${p.funding===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">명의 계획<select name="ownership">${['단독명의','공동명의','아직 미정'].map(v=>`<option ${p.ownership===v?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="actions"><button class="btn primary">변경사항 저장</button>${button('취소','closeModal()')}</div></form>`)}
function saveConditions(e){e.preventDefault();Object.assign(db.project,Object.fromEntries(new FormData(e.target)));event('구매 조건이 변경되었습니다');save();closeModal();render();toast('연결된 전문가에게 최신 조건이 표시됩니다')}
function modal(html){document.querySelector('#modal').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="상세 입력">${html}</section></div>`;document.querySelector('#modal input,#modal textarea,#modal button')?.focus()}
function closeModal(){document.querySelector('#modal').innerHTML=''}
function resetModal(){modal(`<h2>처음부터 다시 체험할까요?</h2><p class="muted" style="margin:18px 0">이 데모의 구매 조건, 요청, 견적, 대화, 문서 목록과 전문가 프로필 설정을 초기화합니다.</p><div class="actions">${button('초기화하고 시작',"resetDemo()",'primary')}${button('취소','closeModal()')}</div>`)}
function resetDemo(){db=initial();save();mode='buyer';page='home';closeModal();history.replaceState({},'',location.pathname+'?mode=buyer');render();toast('처음 방문한 상태로 초기화했습니다')}

function requestFor(role){return db.requests.find(r=>ex(r.expert)?.role===role&&isSelected(r))}
function isSelected(r){return !!r&&['active','completed'].includes(r.status)}
function teamReady(){return ROLES.every(e=>!!requestFor(e.id))}
function journeyMetrics(){const total=Object.values(TASKS).flat().length;const done=ROLES.reduce((n,e)=>n+(requestFor(e.id)?.tasks||[]).filter(t=>t.done).length,0);return {total,done,selected:ROLES.filter(e=>!!requestFor(e.id)).length,percent:Math.round(done/total*100)}}
function nextAction(){
 const missing=ROLES.filter(role=>!requestFor(role.id));
 const quote=db.requests.find(r=>r.status==='quoted'&&missing.some(role=>role.id===ex(r.expert).role));
 if(quote)return {title:ex(quote.expert).type+' 견적을 비교하고 선택해주세요',detail:'받은 견적 중 한 명을 선택하면 나의 필수 전문가 팀에 표시됩니다.',action:button('요청과 견적 보기',"jumpTo('quotes-section')",'small')};
 const role=missing.find(role=>!db.requests.some(r=>ex(r.expert).role===role.id));
 if(role)return {title:role.type+'를 직접 선택해주세요',detail:'각 분야의 후보 3명 중 상담할 전문가를 골라 견적을 요청하세요.',action:button('3명 비교하기',`browseRole('${role.id}')`,'primary small')};
 if(!teamReady())return {title:'요청한 전문가의 견적을 기다리고 있어요',detail:'견적 수신 후 분야별 한 명을 최종 선택해주세요.',action:button('요청과 견적 보기',"jumpTo('quotes-section')",'small')};
 const i=activePhaseIndex();if(i===PHASES.length)return {title:'⑥ 등기 신청 확인까지 완료했어요',detail:'신청 완료와 등기 처리 완료는 다릅니다. 실제 처리 결과와 완료서류는 별도로 확인하세요.',action:button('문서함 보기',"go('documents')",'small')};
 return {title:(i+1)+'단계 · '+PHASES[i].title,detail:PHASES[i].subtitle+' — 앞 단계가 완료되어 진행할 수 있습니다.',action:button('현재 단계 보기',`jumpTo('phase-${PHASES[i].id}')`,'small')};
}
function teamCard(role){
 const r=requestFor(role.id),e=r?ex(r.expert):null,total=TASKS[role.id].length,done=(r?.tasks||[]).filter(t=>t.done).length;
 const requests=db.requests.filter(r=>ex(r.expert).role===role.id),quotes=requests.filter(r=>r.quote).length;
 return `<section class="card team-card"><div class="row between"><span class="badge">${role.type} · 필수</span><span class="team-state">${e?'선택 완료':'담당자 미선택'}</span></div>
 <div class="row" style="margin:18px 0"><div class="avatar">${e?e.name[0]:'＋'}</div><div><h3>${e?e.name:'직접 선택해주세요'}</h3><small>${e?esc(db.profiles[e.id]?.office||e.office):'후보 3명 중 한 명 선택'}</small></div></div>
 <div class="row between"><b class="team-percent">${Math.round(done/total*100)}<small>%</small></b><small>담당 단계 진행률</small></div><div class="progress"><span style="width:${done/total*100}%"></span></div>
 <p class="subtle">담당: ${PHASES.map((p,i)=>p.owner===role.id?`${i+1}단계`:null).filter(Boolean).join(' · ')}</p>
 ${e?button('업무 확인',`workModal('${r.id}')`,'small fullbtn'):button('후보 3명 비교·요청',`browseRole('${role.id}')`,'small fullbtn')}
 <button class="link team-quotes" onclick="jumpTo('quotes-section')">${e?'선택한 견적 확인 →':`요청 ${requests.length}건 · 받은 견적 ${quotes}건 →`}</button></section>`;
}
function journeyPanel(){
 const selected=journeyMetrics().selected,current=activePhaseIndex();
 return `<section class="panel journey-panel"><div class="row between"><h3>전문가 연결·구매 단계</h3><span class="badge">${current}/6단계</span></div>
 <div class="team-status"><strong>사전 준비 · 필수 전문가 연결</strong><small>${selected}/3명 선택 완료</small>
 ${ROLES.map(role=>{const r=requestFor(role.id),pending=db.requests.filter(r=>ex(r.expert).role===role.id);return `<div class="role-connect"><div class="row between"><small>${role.type}</small><span class="badge ${r?'':'gray'}">${r?ex(r.expert).name:'미선택'}</span></div><div class="row between"><button class="link" onclick="browseRole('${role.id}')">후보 3명 보기 →</button>${pending.length?`<button class="link" onclick="jumpTo('quotes-section')">요청·견적 ${pending.length}건 ↓</button>`:''}</div></div>`}).join('')}</div>
 <div class="timeline">${PHASES.map((p,i)=>{const stats=phaseStats(i),done=stats.done===stats.total,open=teamReady()&&i===current;return `<div class="timeline-item ${done?'done':open?'current':''}"><div class="dot">${done?'✓':i+1}</div><div><strong>${p.title}</strong>${open?'<span class="current-label">지금 할 일</span>':''}<small>${p.subtitle}</small><small>단계 진행률 ${stats.percent}%</small><div class="progress"><span style="width:${stats.percent}%"></span></div><small>${done?'완료':!teamReady()?'세 전문가 선택 후 시작':i>current?'앞 단계 완료 후 열림':'진행 가능'}</small><button class="link" onclick="document.getElementById('phase-${p.id}').scrollIntoView({behavior:'smooth',block:'center'})">상세 단계 보기 →</button></div></div>`}).join('')}</div>
 <div class="privacy">⑥의 완료 기준은 등기 <b>신청 확인</b>입니다. 실제 등기 처리 완료를 의미하지 않습니다.</div></section>`;
}
function browseRole(id){filter=ROLES.find(r=>r.id===id).type;go('experts')}
function jumpTo(id){if(mode!=='buyer'){mode='buyer'}if(page!=='project'){go('project')}const node=document.getElementById(id);if(node){node.scrollIntoView({behavior:'smooth',block:'start'});node.setAttribute('tabindex','-1');node.focus({preventScroll:true})}}
function phaseStats(index){
 const p=PHASES[index],r=requestFor(p.owner),total=p.tasks.length;
 const done=p.tasks.filter(title=>r?.tasks?.some(t=>t.title===title&&t.done)).length;
 return {done,total,percent:Math.round(done/total*100)};
}
function activePhaseIndex(){return PHASES.findIndex((p,i)=>phaseStats(i).done<p.tasks.length)<0?PHASES.length:PHASES.findIndex((p,i)=>phaseStats(i).done<p.tasks.length)}
function taskBlockReason(r,taskIndex,checking){
 if(!isSelected(r)||requestFor(ex(r.expert).role)?.id!==r.id)return '선택된 담당 전문가만 진행할 수 있습니다';
 if(!teamReady())return '세 전문가 선택 완료 후 진행';
 const title=r.tasks[taskIndex]?.title,index=PHASES.findIndex(p=>p.owner===ex(r.expert).role&&p.tasks.includes(title));
 if(index<0)return '지원하지 않는 업무 항목';
 if(checking&&PHASES.some((p,i)=>i<index&&phaseStats(i).done<phaseStats(i).total))return '앞 단계의 모든 항목 완료 후 진행';
 if(!checking&&PHASES.some((p,i)=>i>index&&phaseStats(i).done>0))return '뒤 단계 완료 항목을 먼저 해제해주세요';
 return '';
}
function phaseBoard(){
 const current=activePhaseIndex();
 return `<section class="section anchor-section" id="purchase-section"><div class="sectionhead"><h2>6단계 구매 진행</h2><span class="badge">${current}/6단계 완료</span></div>
 <div class="privacy" style="margin-bottom:18px">세무사는 서비스 정책상 필수입니다. 각 체크는 담당 전문가가 처리 여부를 기록하는 기능이며, 실제 송금·신고·등기 접수를 실행하지 않습니다.</div>
 ${PHASES.map((p,i)=>{const stats=phaseStats(i),r=requestFor(p.owner),done=stats.done===stats.total,open=teamReady()&&i===current;return `<article class="panel purchase-phase ${open?'phase-current':''}" id="phase-${p.id}"><div class="row between"><div class="row"><span class="phase-number">${done?'✓':String(i+1).padStart(2,'0')}</span><div><h3>${p.title}</h3><small>${p.subtitle}</small></div></div><span class="badge ${open||done?'':'gray'}">${done?'완료':open?'진행 중':'대기'}</span></div><div class="progress"><span style="width:${stats.percent}%"></span></div><div class="row between"><small>단계 진행률</small><b>${stats.percent}%</b></div>
 <div class="row between"><small>${done?'담당 전문가가 모든 항목을 확인했습니다.':!teamReady()?'세 전문가 선택 후 업무를 시작합니다.':open?ex(r.expert).name+' 전문가의 확인을 기다립니다.':'앞 단계가 완료되면 열립니다.'}</small>${r?messageLink(r.id,'담당자 대화 ↗'):''}</div></article>`}).join('')}</section>`;
}

function visibleRequests(){return mode==='buyer'?db.requests:db.requests.filter(r=>r.expert===expertId)}
function messageHref(id='all'){return '?mode='+mode+'&view=messages&expert='+expertId+'&conversation='+encodeURIComponent(id)}
function messageLink(id,label){return `<a class="btn small" href="${messageHref(id)}">${label}</a>`}
function messageLauncher(){if(page==='messages')return '';return `<a class="message-launcher" href="${messageHref()}" aria-label="통합 메시지 센터 열기"><span class="bubble-icon">✉</span><span><b>메시지</b><small>모든 대화 한곳에 ↗</small></span><span class="message-count">${visibleRequests().length}</span></a>`}
function messageBubble(m,combined=false){
 const r=visibleRequests().find(r=>r.id===m.request);if(!r)return '';
 return `<div class="message ${m.role===mode?'mine':''}"><small>${m.role==='buyer'?esc(db.buyer?.name||'구매자'):ex(r.expert).name} · ${m.time}${combined?' · '+ex(r.expert).type:''}</small><div class="message-text">${esc(m.text)}</div>${combined?`<button class="link" onclick="selectConversation('${r.id}')">이 대화 열기 →</button>`:''}</div>`;
}
function selectConversation(id){conversation=id;history.replaceState({},'',routeUrl());render();document.querySelector('#chat-history')?.scrollTo(0,999999)}
function messagesView(){
 const rs=visibleRequests(),selected=rs.find(r=>r.id===conversation);
 if(conversation!=='all'&&!selected)conversation='all';
 const messages=db.messages.filter(m=>rs.some(r=>r.id===m.request));
 return `${heading('JIBEUM MESSAGES','통합 메시지 센터',mode==='buyer'?'세 전문가와의 대화를 한곳에서 확인하고 이어가세요.':'담당 구매자와의 대화만 표시됩니다.',button('프로젝트로 돌아가기',mode==='buyer'?"go('project')":"go('workspace')",'small'))}
 <div class="inbox"><aside class="conversation-list"><div class="conversation-heading">대화 목록 <span class="badge">${rs.length}</span></div><button class="conversation ${conversation==='all'?'selected':''}" onclick="selectConversation('all')"><div class="row"><span class="avatar">☷</span><div><strong>모든 메시지</strong><small>연결된 대화를 시간순으로</small></div></div></button>
 ${rs.map(r=>{const e=ex(r.expert),latest=db.messages.filter(m=>m.request===r.id).at(-1);return `<button class="conversation ${r.id===conversation?'selected':''}" onclick="selectConversation('${r.id}')"><div class="row"><div class="avatar">${mode==='buyer'?e.name[0]:esc(db.buyer.name[0])}</div><div><strong>${mode==='buyer'?e.name:esc(db.buyer.name)}</strong><small>${e.type}</small></div></div><p>${latest?esc(latest.text):'새 대화를 시작해보세요'}</p></button>`}).join('')}
 ${!rs.length?'<p class="subtle" style="padding:20px">전문가에게 요청하면 대화가 생성됩니다.</p>':''}</aside>
 <section class="conversation-content"><header class="conversation-heading"><div><h3>${selected?(mode==='buyer'?ex(selected.expert).name+' '+ex(selected.expert).type:esc(db.buyer.name)+' 님'):'모든 메시지'}</h3><small>${selected?'구매자와 담당 전문가의 1:1 대화':'전체 대화 모아보기 · 답장할 대상을 선택해주세요'}</small></div><span class="badge">${selected?'1:1 대화':'통합 보기'}</span></header>
 <div class="conversation-body">${selected?chat(selected):`<div class="chat" id="chat-history">${messages.length?messages.map(m=>messageBubble(m,true)).join(''):'<div class="empty-chat"><span class="bubble-icon">✉</span><h3>아직 주고받은 메시지가 없어요</h3><p>왼쪽에서 전문가를 선택해 대화를 시작하세요.</p></div>'}</div>`}</div>
 </section></div>`;
}

window.addEventListener('storage',e=>{if(e.key===KEY){try{db=JSON.parse(e.newValue)||initial();closeModal();render()}catch{}}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
